version: 2

updates:
  # pnpm monorepo — root pnpm-lock.yaml covers all workspace packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      next-ecosystem:
        patterns:
          - "next"
          - "@next/*"
        update-types:
          - minor
          - patch
      supabase-ecosystem:
        patterns:
          - "@supabase/*"
          - "supabase"
        update-types:
          - minor
          - patch
      # Radix primitives pin exact versions of their shared internals
      # (react-dismissable-layer, react-focus-guards, …). Bumping one primitive
      # alone installs two copies of a package that is only correct as a
      # singleton — see #430. Move them together.
      radix-ecosystem:
        patterns:
          - "@radix-ui/*"
        update-types:
          - minor
          - patch
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@types/node"
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "turbo"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/*"
        update-types:
          - version-update:semver-major
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: scope
